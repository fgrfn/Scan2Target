name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev, 'agent/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Check critical Python errors
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Run tests
        env:
          SCAN2TARGET_REQUIRE_AUTH: 'true'
        run: pytest -q 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest.log
          retention-days: 3

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - name: Run frontend logic tests
        run: npm test
      - name: Check Svelte
        run: npm run check 2>&1 | tee svelte-check.log
      - name: Upload Svelte diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svelte-check-diagnostics
          path: app/web/svelte-check.log
          retention-days: 3
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Run multi-page browser flow
        run: npm run test:e2e

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scan2target:ci .
      - name: Start container and check health
        run: |
          docker run --privileged -d --name scan2target-ci -p 8000:8000 \
            -e SCAN2TARGET_SECRET_KEY='ci-only-secret-not-for-production' \
            -e SCAN2TARGET_JWT_SECRET='ci-only-jwt-secret-not-for-production' \
            -e SCAN2TARGET_REQUIRE_AUTH='false' \
            scan2target:ci

          healthy=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 1
          done

          if [ "$healthy" != true ]; then
            docker logs scan2target-ci
            exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs scan2target-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f scan2target-ci || true
