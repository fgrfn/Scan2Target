services:
  scan2target:
    build:
      context: .
      dockerfile: Dockerfile
    image: scan2target:latest
    container_name: scan2target
    restart: unless-stopped

    volumes:
      - scan2target-data:/data
      - scan2target-logs:/var/log/scan2target
      # USB scanner access (optional):
      # - /dev/bus/usb:/dev/bus/usb

    # devices:
      # - /dev/bus/usb

    environment:
      - SCAN2TARGET_DATA_DIR=${SCAN2TARGET_DATA_DIR:-/data}
      - SCAN2TARGET_DATABASE_PATH=${SCAN2TARGET_DATABASE_PATH:-/data/db/scan2target.db}
      - SCAN2TARGET_LOG_DIR=${SCAN2TARGET_LOG_DIR:-/var/log/scan2target}
      - SCAN2TARGET_HEALTH_CHECK_INTERVAL=${SCAN2TARGET_HEALTH_CHECK_INTERVAL:-60}
      - SCAN2TARGET_SCANNER_CHECK_INTERVAL=${SCAN2TARGET_SCANNER_CHECK_INTERVAL:-30}

      # No insecure fallback is provided. Create .env and generate this value
      # with: openssl rand -base64 48
      - SCAN2TARGET_SECRET_KEY=${SCAN2TARGET_SECRET_KEY:?Set SCAN2TARGET_SECRET_KEY in .env}
      - SCAN2TARGET_JWT_SECRET=${SCAN2TARGET_JWT_SECRET:-}
      - SCAN2TARGET_REQUIRE_AUTH=${SCAN2TARGET_REQUIRE_AUTH:-true}
      - SCAN2TARGET_HA_API_KEY=${SCAN2TARGET_HA_API_KEY:-}
      - SCAN2TARGET_CORS_ORIGINS=${SCAN2TARGET_CORS_ORIGINS:-}
      - SCAN2TARGET_ALLOW_PRIVATE_WEBHOOKS=${SCAN2TARGET_ALLOW_PRIVATE_WEBHOOKS:-false}
      - SCAN2TARGET_MAX_REQUEST_SIZE_MB=${SCAN2TARGET_MAX_REQUEST_SIZE_MB:-100}
      - SCAN2TARGET_MAX_BATCH_PAGE_MB=${SCAN2TARGET_MAX_BATCH_PAGE_MB:-20}
      - SCAN2TARGET_MAX_BATCH_PAGES=${SCAN2TARGET_MAX_BATCH_PAGES:-100}

    # Host networking is required for mDNS/AirScan discovery.
    network_mode: host

    # privileged: true  # May be needed for some USB scanners.

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  scan2target-data:
    driver: local
  scan2target-logs:
    driver: local
